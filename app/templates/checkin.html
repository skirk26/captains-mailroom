<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1C2B4A">
  <title>Check In · Captain's Mail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page-shell d-flex flex-column">
    <header class="app-header d-flex align-items-center px-2">
      <a href="{{ url_for('dashboard.dashboard') }}" class="header-back" aria-label="Back to dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="h5 fw-semibold mb-0 ms-1">Check In</h1>
    </header>

    <main id="checkin" class="checkin-main d-flex flex-column flex-grow-1 px-3 pt-3 pb-4" data-state="starting"
          data-confirm-url="{{ url_for('checkin.confirm') }}">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'message' else 'secondary' }} py-2 mb-3" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      <div id="viewfinder" class="scan-viewfinder flex-grow-1">
        <!-- html5-qrcode empties #reader on start/stop, so overlays live beside it -->
        <div id="reader"></div>
        <div id="scan-frame" class="scan-frame" aria-hidden="true">
          <span class="scan-corner scan-corner-tl"></span>
          <span class="scan-corner scan-corner-tr"></span>
          <span class="scan-corner scan-corner-bl"></span>
          <span class="scan-corner scan-corner-br"></span>
          <span class="scan-placeholder">Camera preview</span>
        </div>
        <div class="scan-message" role="alert">
          <p id="scan-message-title" class="fw-semibold mb-1"></p>
          <p id="scan-message-body" class="small mb-0"></p>
        </div>
      </div>

      <p class="scan-instruction text-center fw-medium mt-3 mb-2">Point your camera at the shipping label barcode</p>
      <p class="text-center mb-0">
        <a href="#manual-entry" id="manual-entry-toggle" class="link-gold"
           aria-controls="manual-entry" aria-expanded="false">Can't scan? Enter tracking number manually</a>
      </p>

      <form id="manual-entry" class="mt-3" action="{{ url_for('checkin.confirm') }}" method="get" hidden>
        <input type="hidden" name="source" value="manual">
        <label for="manual-tracking" class="form-label">Tracking number</label>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-lg" id="manual-tracking" name="tracking"
                 autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
          <button type="submit" class="btn btn-navy btn-lg">Continue</button>
        </div>
      </form>
    </main>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
          integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"
          crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/scanner.js') }}"></script>
  <!-- Separate from scanner.js so the manual fallback still works if the scanner fails to load -->
  <script src="{{ url_for('static', filename='js/manual_entry.js') }}"></script>
</body>
</html>
