<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1C2B4A">
  <title>Sign In · Captain's Mail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="login-wrapper d-flex align-items-center justify-content-center px-3 py-4">
    <div class="card login-card shadow-sm">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <p class="brand-label text-uppercase fw-semibold text-gold mb-1">CNU Mailroom</p>
          <h1 class="h2 fw-bold text-navy mb-0">Captain's Mail</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category if category != 'message' else 'secondary' }} py-2" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endwith %}

        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control form-control-lg" id="username" name="username"
                   value="{{ username or '' }}" autocomplete="username" autocapitalize="none"
                   autocorrect="off" spellcheck="false" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-navy btn-lg w-100">Sign In</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">Staff access only</p>
      </div>
    </div>
  </main>
</body>
</html>
